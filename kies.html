<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>One Peak</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.7.5/dist/css/foundation.min.css">
</head>

<body>

    <div class="top-bar">
        <div class="top-bar-left">
            <ul class="menu">
                <li class="menu-text">One Peak</li>
                <li><a href="begin.html">Home</a></li>
                <li><a href="student.html">Straw Hats</a></li>
                <li class="is-active"><a href="index.html">Statistics</a></li>
            </ul>
        </div>
        <div class="top-bar-right">
            <ul class="menu">
                <li><a href="set.html">Settings</a></li>
                <li><a href="#">Log out</a></li>
            </ul>
        </div>
    </div>

    <div class="grid-container fluid">
        <div class="grid-x grid-margin-x">

            <div class="cell medium-2">
                <ul class="vertical menu">
                    <li><strong>Menu</strong></li>
                    <li><a href="begin.html">Home</a></li>
                    <li><a href="student.html">Straw Hats</a></li>
                    <li class="is-active"><a href="index.html">Statistics</a></li>
                    <li><a href="set.html">Settings</a></li>
                </ul>
                <button class="button alert expanded">Log out</button>
            </div>

        </div>
        </div>

            <div class="callout">
                <h4>Add your own Character</h4>
                <form id="add-character-form">
                    <label>Jouw Naam</label>
                    <input type="text" id="user-name" required> <br>

                    <label>Rol in crew</label>
                    <input type="text" id="user-role" required> <br>

                    <label>Leeftijd</label>
                    <input type="text" id="user-age" required> <br>

                    <label>Lengte</label>
                    <input type="text" id="user-height" required> <br>

                    <label>Verjaardag</label>
                    <input type="text" id="user-birthday" required> <br>

                    <label>epithet (bijnaam)</label>
                    <input type="text" id="user-epithet" required> <br>

                    <button type="submit" class="button primary">Add to crew</button>
                </form>
            </div>

            <script>
                document.getElementById('add-character-form').addEventListener('submit', function (e)) {
                    e.preventdefault(;)
                    const name = document.getElementById('user-name').value;
                    const role = document.getElementById('user-role').value;
                    const age = document.getElementById('user-age').value;
                    const height = document.getElementById('user-height').value;
                    const birthday = document.getElementById('user-birthday').value;
                    const epithet = document.getElementById('user-epithet').value;

                    const newCharacter = document.createElementz('div');
                    newCharacter.className = 'callout';
                    newCharacter.innerHTML =
                        <div class="grid-x grid-margin-x">
                            <div class="cell medium-4">
                                <img src="${image}" alt="${name}" class="thumbnail">
                            </div>
                            <div class="cell medium-8">
                                <h4>${name} <br> (${role})</h4>
                                <p>Epithet: ${epithet}</p>
                                <p>Age: ${age}</p>
                                <p>Height: ${height} cm</p>
                                <p>Birthday: ${birthday}</p>
                                <a href="#" class="button hollow primary">View full profile</a>
                            </div>
                        </div>; 
                        document.querySelector('.cell.medium-7').appendChild(newCharacter);
                        e.target.reset();});</script>
            

            <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/foundation-sites@6.7.5/dist/js/foundation.min.js"></script>
</body>

</html>
