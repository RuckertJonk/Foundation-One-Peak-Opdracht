<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>One Peak</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.7.5/dist/css/foundation.min.css">
</head>

<body>

    <div class="top-bar">
        <div class="top-bar-left">
            <ul class="menu">
                <li class="menu-text">One Peak</li>
                <li><a href="begin.html">Home</a></li>
                <li><a href="student.html">Straw Hats</a></li>
                <li><a href="index.html">Statistics</a></li>
            </ul>
        </div>
        <div class="top-bar-right">
            <ul class="menu">
                <li class="is-active"><a href="set.html">Settings</a></li>
                <li><a href="#">Log out</a></li>
            </ul>
        </div>
    </div>

    <div class="grid-container fluid">
        <div class="grid-x grid-margin-x">
            <div class="cell medium-8">
  <div class="callout">
    <h3>Instellingen</h3>
    <form id="settings-form">
      <label>Jouw naam:</label>
      <input type="text" id="user-name" placeholder="Bijv. Monkey D. Rick">

      <label>Thema:</label>
      <select id="theme">
        <option value="light">Licht</option>
        <option value="dark">Donker</option>
      </select>

      <label>Taal:</label>
      <select id="language">
        <option value="nl">Nederlands</option>
        <option value="en">Engels</option>
      </select>

      <label>Notificaties:</label>
      <input type="checkbox" id="notifications"> Inschakelen

      <label>Volume:</label>
      <input type="range" id="volume" min="0" max="100" value="50">

      <button type="submit" class="button success">Instellingen opslaan</button>
    </form>
    <div id="confirmation" style="margin-top: 1rem;"></div>
  </div>
</div>
</div>
</div>



            <div class="cell medium-2">
                <ul class="vertical menu">
                    <li><strong>Menu</strong></li>
                    <li><a href="begin.html">Home</a></li>
                    <li><a href="student.html">Straw Hats</a></li>
                    <li><a href="index.html">Statistics</a></li>
                    <li class="is-active"><a href="set.html">Settings</a></li>
                </ul>
                <button class="button alert expanded">Log out</button>
            </div>

            <script>
  document.getElementById('settings-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const settings = {
      name: document.getElementById('user-name').value,
      theme: document.getElementById('theme').value,
      language: document.getElementById('language').value,
      notifications: document.getElementById('notifications').checked,
      volume: document.getElementById('volume').value
    };

    console.log("Instellingen opgeslagen:", settings);

    document.getElementById('confirmation').innerHTML =
      `<strong>Instellingen opgeslagen!</strong><br>Naam: ${settings.name}<br>Thema: ${settings.theme}<br>Taal: ${settings.language}<br>Notificaties: ${settings.notifications ? 'Aan' : 'Uit'}<br>Volume: ${settings.volume}`;
  });
</script>



                
            </body>
        </html>
